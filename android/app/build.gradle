apply plugin: 'com.android.application'

/*
 * Version comes from the environment so CI owns it.
 *
 * BUILD_NUMBER is the GitHub Actions run number, which only ever increases. That
 * matters more than it looks: Android refuses to install an APK whose versionCode
 * is not greater than the installed one, and the in-app updater compares this
 * number against the published manifest to decide whether a client is stale.
 *
 * Falls back to 1 / "1.0-dev" so a local `./gradlew assembleDebug` still works
 * without any of this set.
 */
def ciBuildNumber = (System.getenv("BUILD_NUMBER") ?: "1") as Integer
def ciVersionName = System.getenv("VERSION_NAME") ?: "1.0-dev"

android {
    namespace "com.hillbcs.letschat"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hillbcs.letschat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciBuildNumber
        versionName ciVersionName
        /*
         * Ship only the two ABIs real phones use.
         *
         * The Jitsi SDK bundles WebRTC and Hermes native libraries for four
         * architectures, which took the APK from 8 MB to 186 MB. That matters more
         * here than in a Play-distributed app: updates are delivered by
         * downloading the whole APK over whatever connection the user has.
         *
         * Dropping x86/x86_64 loses emulators and ChromeOS, not handsets.
         */
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * Release signing, driven by env vars so the keystore never lands in the repo.
     *
     * The key has to be the *same* on every build that users upgrade through.
     * Android identifies an app by package name plus signing certificate, so a
     * build signed with a different key is a different app as far as the installer
     * is concerned and the upgrade is rejected with
     * INSTALL_FAILED_UPDATE_INCOMPATIBLE — the user would have to uninstall first,
     * losing their session. This is why CI must not fall back to a debug key.
     */
    signingConfigs {
        release {
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only when a keystore was supplied; otherwise the release build stays
            // unsigned and fails loudly at install time rather than shipping an
            // APK that silently cannot be upgraded.
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // FCM. Pinned to the same version the Hillbcs Chats app ships, so both
    // Android clients talk to Firebase through an identical messaging stack.
    // Harmless without google-services.json: the google-services plugin below is
    // only applied when that file exists, and Firebase simply never initialises.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    /*
     * Native Jitsi Meet, used instead of the web client on this platform so that
     * screen sharing works: Android's WebView does not implement
     * getDisplayMedia(), so the browser-based call surface can never capture the
     * screen no matter what permissions are granted. The SDK goes through
     * MediaProjection instead.
     *
     * transitive = true is required — the SDK pulls in React Native, Hermes, and
     * WebRTC, and none of it resolves without it. That is also why this adds tens
     * of megabytes to the APK.
     */
    implementation("org.jitsi.react:jitsi-meet-sdk:$rootProject.ext.jitsiMeetSdkVersion") {
        transitive = true
    }
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
