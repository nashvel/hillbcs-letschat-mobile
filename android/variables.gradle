ext {
    /*
     * 26, up from 23, because jitsi-meet-sdk 13.1.1 declares minSdk 26 and the
     * manifest merger refuses anything lower. That is Android 8.0+, so devices on
     * 7.x can no longer install — accepted deliberately in exchange for native
     * calls and screen sharing.
     *
     * tools:overrideLibrary would silence the merger instead, but it only defers
     * the problem to a runtime crash on the older devices it pretends to support.
     */
    minSdkVersion = 26
    jitsiMeetSdkVersion = '13.1.1'
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}